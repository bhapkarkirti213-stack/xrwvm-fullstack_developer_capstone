<html>
<head>
  <title>Contact Us - Best Cars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <style>
    .contact-card { width: 70%; margin: 5% auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .contact-card h1 { color: darkblue; margin-bottom: 20px; }
    .contact-row { display: flex; flex-wrap: wrap; gap: 30px; align-items: center; }
    .contact-info p { font-size: 1.1rem; margin: 6px 0; }
    .contact-info .label { font-weight: bold; color: #006d77; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" style="font-size: larger;" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" style="font-size: larger;" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link active" style="font-size: larger;" aria-current="page" href="/contact">Contact Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="card contact-card">
  <h1>Contact Us</h1>
  <div class="contact-row">
    <img src="/static/contactus.png" alt="Contact us" style="width: 280px; max-width: 100%;">
    <div class="contact-info">
      <p><span class="label">Address:</span> 123 Auto Plaza, Wichita, Kansas 67202, USA</p>
      <p><span class="label">Phone:</span> +1 (316) 555-0142</p>
      <p><span class="label">Email:</span> support@bestcars.com</p>
      <p><span class="label">Sales:</span> sales@bestcars.com</p>
      <p><span class="label">Hours:</span> Mon-Sat, 9:00 AM - 7:00 PM</p>
    </div>
  </div>
</div>

</html>
